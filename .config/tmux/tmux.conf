# Vi mode
# set -g default-terminal "xterm-256color"
set-option -sa terminal-features ',XXX:RGB'
set-option -sa terminal-overrides ",xterm*:Tc"

# Desktop notifications (OpenCode/OpenTUI) {{{
# OpenCode wraps notification OSCs in tmux DCS passthrough; tmux must allow it.
# "all" also forwards from panes that are not currently visible.
set-option -g allow-passthrough all
# Outer terminal here is Ghostty, which speaks OSC 777. Force it because tmux
# hides the outer terminal identity (TERM_PROGRAM becomes "tmux").
set-environment -g OPENTUI_NOTIFICATION_PROTOCOL osc777
# }}}

set -s escape-time 0

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

set-option -g history-limit 64096

set-option -g detach-on-destroy off

set -g base-index 1           # start indexing windows at 1 instead of 0

# Keybinds {{{
set-option -g repeat-time 0
set-option -g focus-events on

# Action key
unbind C-b
set-option -g prefix C-Space
set-option -g repeat-time 0
set-option -g focus-events on

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Manage panes
bind ] split-window -h -c "#{pane_current_path}"
bind = split-window -v -c "#{pane_current_path}"

bind q kill-pane

bind -n C-S-k resize-pane -U 5
bind -n C-S-j resize-pane -D 5
bind -n C-S-h resize-pane -L 5
bind -n C-S-l resize-pane -R 5

# Status Bar {{{
set-option -g status-position top

set-option -g status-left-length 50
set-option -g status-left ""
set-option -g status-right "#[fg=white]#(whoami) #[fg=green,bold][ #S ]"
# }}}

# Attention {{{
# Flag background windows that produce output or ring the bell.
set -g monitor-activity on
set -g activity-action other   # ignore output from the current window
set -g monitor-bell on
set -g bell-action other
set -g visual-activity off     # no status-line message, style only
set -g visual-bell off
set -g visual-silence off

# Silence gate: a window "needs attention" only once it has output since your
# last visit AND has gone quiet for this many seconds. Agent TUIs stream output
# while working, so activity alone would flag them the whole time.
set -g monitor-silence 5

# Commands that never count as "needs attention". Matched against
# pane_current_command (the pane's foreground process), so `npm run dev` shows up
# as "node" or whichever tool it spawns.
#   servers/watchers: npm/npx/pnpm/yarn/bun/deno/node/nodemon/vite/next/webpack/
#                     esbuild/rollup/tsc/tsx/python/uvicorn/gunicorn/flask/celery/
#                     php/ruby/rails/puma/java/mvn/gradle/dotnet/cargo/go/air/
#                     docker/postgres/mysqld/redis-server/mongod/httpd/nginx
#   full-screen apps: nvim/vim/vi/view/less/more/man/htop/btop/top — they redraw
#                     on focus changes and would flag themselves every time you
#                     look elsewhere
#   shells:           a returned prompt is not an alert; remove these if you want
#                     "long command finished" to light the tab
set -g @attention_ignore '^(npm|npx|pnpm|yarn|bun|deno|node|nodemon|vite|next|webpack|esbuild|rollup|tsc|tsx|python[0-9.]*|uvicorn|gunicorn|flask|celery|php|ruby|rails|puma|java|mvn|gradle|dotnet|cargo|go|air|docker|docker-compose|postgres|mysqld?|redis-server|mongod|httpd|nginx|nvim|vim|vi|view|less|more|man|htop|btop|top|fish|bash|zsh|sh|dash|ksh|tcsh|csh|nu|elvish|xonsh)$'
# }}}

# Theme {{{
set-option -g status-style bg=default,fg=yellow,nobold

set -g window-status-style bg=default,fg=yellow
set -g window-status-current-style bg=yellow,fg=black,bold
# Attention styling is applied inline by the window formats (it needs a
# condition tmux's own options cannot express), so the built-in activity style
# stays neutral. It fires on activity OR silence, which would redden every
# silent window. Bells stay a direct signal: explicit hex because cendre's "red"
# maps to #d1766e but its "white" (#a09384) is unreadable as a foreground.
set -g window-status-activity-style default
set -g window-status-bell-style bg=default,fg=#d1766e,bold

set -g pane-active-border-style fg=black,bg=default
set -g pane-border-style fg=brightblack,bg=default
# }}}

# Window {{{
set -g window-status-current-format '[#{window_index}]:#{?#{==:#{pane_current_command},nvim},#T,#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}}* '
# Ignored commands keep the normal yellow text even when flagged; everything
# else turns red only when activity and silence coincide. Two style directives:
# a comma inside #[...] would split the ternary arguments.
set -g window-status-format '#{?#{m/r:#{@attention_ignore},#{pane_current_command}},#[fg=yellow]#[nobold],#{?#{&&:#{window_activity_flag},#{window_silence_flag}},#[fg=#d1766e]#[bold],}}[#{window_index}]:#{?#{==:#{pane_current_command},nvim},#T,#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{pane_current_command}}} '
# }}}

# Plugins {{{
set -g @plugin "tmux-plugins/tmux-sensible"
set -g @plugin "tmux-plugins/tmux-yank"

set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_up ""

# resize
set -g @tmux-nvim-resize false

set -g @plugin "tmux-plugins/tpm"
run "~/.config/tmux/plugins/tpm/tpm"
unbind-key -n C-k
unbind-key -T copy-mode-vi C-k
# }}}
